{% extends "base.html" %}
{% from "macros/components.html" import page_header, stat_card, stat_grid, section_title, badge %}

{% block title %}Аналитика - Seller Hub{% endblock %}

{% block content %}
<div x-data="analyticsPage()">

    {# ── Page Header ── #}
    <div class="sh-page-header">
        <div class="sh-page-header-content">
            <div>
                <h1 class="sh-page-title">Аналитика продаж</h1>
                <p class="sh-page-subtitle">Данные воронки продаж Wildberries</p>
            </div>
            <div class="sh-page-actions" style="display:flex;align-items:center;gap:12px">
                <!-- Refresh button -->
                <button @click="refreshData()" :disabled="loading"
                    class="sh-btn sh-btn--white-outline sh-btn--sm" style="display:inline-flex;align-items:center;gap:6px">
                    <svg class="w-4 h-4" :class="loading && 'animate-spin'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Обновить
                </button>
                <!-- Period selector -->
                <div style="display:inline-flex;border-radius:6px;background:rgba(255,255,255,0.1);padding:3px">
                    <template x-for="p in periods" :key="p.value">
                        <button @click="changePeriod(p.value)"
                            :class="period === p.value ? 'bg-white shadow-sm text-[#1a1a1a] font-semibold' : 'text-white/80 hover:text-white hover:bg-white/10'"
                            class="px-3 py-1.5 text-sm rounded-md transition-all" x-text="p.label"></button>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div style="max-width:1280px;margin:0 auto;padding:0 24px">

    <!-- Loading overlay -->
    <template x-if="loading && !hasData">
        <div style="display:flex;align-items:center;justify-content:center;padding:80px 0">
            <div style="text-align:center">
                <svg class="animate-spin" style="height:40px;width:40px;color:var(--accent);margin:0 auto 16px" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <p style="color:var(--text-muted)">Загрузка аналитики...</p>
            </div>
        </div>
    </template>

    <!-- Error message -->
    <template x-if="error && !hasData">
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:24px;margin-bottom:32px">
            <p style="color:#b91c1c" x-text="error"></p>
            <button @click="loadData()" style="margin-top:12px;font-size:14px;color:#dc2626;text-decoration:underline">Попробовать снова</button>
        </div>
    </template>

    <template x-if="hasData || !loading">
    <div>
    {# ── KPI Stat Cards ── #}
    <div class="sh-stat-grid sh-stat-grid--4" style="margin-bottom:32px">
        <!-- Revenue -->
        <div class="sh-stat-card">
            <div class="sh-stat-header">
                <span class="sh-stat-label">Заказы (сумма)</span>
                <template x-if="kpi.dynamics.revenue !== null && kpi.dynamics.revenue !== 0">
                    <span class="sh-stat-trend"
                        :class="kpi.dynamics.revenue >= 0 ? 'sh-stat-trend--up' : 'sh-stat-trend--down'">
                        <span x-text="(kpi.dynamics.revenue >= 0 ? '+' : '') + kpi.dynamics.revenue.toFixed(1) + '%'"></span>
                    </span>
                </template>
            </div>
            <div class="sh-stat-value" x-text="formatMoney(kpi.revenue)"></div>
            <div style="margin-top:12px;height:40px">
                <canvas x-ref="sparkRevenue"></canvas>
            </div>
        </div>

        <!-- Orders -->
        <div class="sh-stat-card">
            <div class="sh-stat-header">
                <span class="sh-stat-label">Заказы (шт.)</span>
                <template x-if="kpi.dynamics.orders !== null && kpi.dynamics.orders !== 0">
                    <span class="sh-stat-trend"
                        :class="kpi.dynamics.orders >= 0 ? 'sh-stat-trend--up' : 'sh-stat-trend--down'">
                        <span x-text="(kpi.dynamics.orders >= 0 ? '+' : '') + kpi.dynamics.orders.toFixed(1) + '%'"></span>
                    </span>
                </template>
            </div>
            <div class="sh-stat-value" x-text="kpi.orders.toLocaleString('ru-RU')"></div>
            <div style="margin-top:12px;height:40px">
                <canvas x-ref="sparkOrders"></canvas>
            </div>
        </div>

        <!-- Average Check -->
        <div class="sh-stat-card">
            <div class="sh-stat-header">
                <span class="sh-stat-label">Средний чек</span>
            </div>
            <div class="sh-stat-value" x-text="formatMoney(kpi.avgCheck)"></div>
            <div style="margin-top:12px;height:40px">
                <canvas x-ref="sparkAvgCheck"></canvas>
            </div>
        </div>

        <!-- Buyouts -->
        <div class="sh-stat-card">
            <div class="sh-stat-header">
                <span class="sh-stat-label">Выкупы</span>
                <template x-if="kpi.dynamics.buyouts !== null && kpi.dynamics.buyouts !== 0">
                    <span class="sh-stat-trend"
                        :class="kpi.dynamics.buyouts >= 0 ? 'sh-stat-trend--up' : 'sh-stat-trend--down'">
                        <span x-text="(kpi.dynamics.buyouts >= 0 ? '+' : '') + kpi.dynamics.buyouts.toFixed(1) + '%'"></span>
                    </span>
                </template>
            </div>
            <div class="sh-stat-value" x-text="kpi.buyouts.toLocaleString('ru-RU')"></div>
            <div style="margin-top:12px;height:40px">
                <canvas x-ref="sparkBuyouts"></canvas>
            </div>
        </div>
    </div>

    {# ── Conversion Funnel ── #}
    <div class="sh-stat-grid sh-stat-grid--3" style="margin-bottom:32px">
        <div class="sh-stat-card" style="text-align:center">
            <div class="sh-stat-label" style="margin-bottom:4px">Переходы в карточку</div>
            <div class="sh-stat-value" x-text="kpi.openCardCount.toLocaleString('ru-RU')"></div>
            <div class="sh-stat-footnote" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;color:var(--accent)">
                <svg style="width:12px;height:12px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                <span x-text="kpi.conversions.addToCartPercent.toFixed(1) + '% в корзину'"></span>
            </div>
        </div>
        <div class="sh-stat-card" style="text-align:center">
            <div class="sh-stat-label" style="margin-bottom:4px">Добавили в корзину</div>
            <div class="sh-stat-value" x-text="kpi.addToCartCount.toLocaleString('ru-RU')"></div>
            <div class="sh-stat-footnote" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;color:var(--accent)">
                <svg style="width:12px;height:12px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                <span x-text="kpi.conversions.cartToOrderPercent.toFixed(1) + '% в заказ'"></span>
            </div>
        </div>
        <div class="sh-stat-card" style="text-align:center">
            <div class="sh-stat-label" style="margin-bottom:4px">Процент выкупа</div>
            <div class="sh-stat-value" x-text="kpi.conversions.buyoutPercent.toFixed(1) + '%'"></div>
            <div class="sh-stat-footnote" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;color:var(--text-muted)">
                <span x-text="'Отмены: ' + kpi.cancels.toLocaleString('ru-RU')"></span>
            </div>
        </div>
    </div>

    {# ── Charts Row ── #}
    <div style="display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:32px" class="lg:grid-cols-3">
        <!-- Sales chart (2 cols) -->
        <div class="sh-card lg:col-span-2" style="position:relative;overflow:hidden;padding:24px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
                <h2 style="font-family:var(--font-display);font-style:italic;font-size:1.25rem;color:var(--text)">Динамика продаж</h2>
                <div style="display:flex;align-items:center;gap:16px;font-size:12px;color:var(--text-secondary)">
                    <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:50%;background:#6366f1"></span> Заказы (руб)</span>
                    <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:50%;background:#34d399"></span> Заказы (шт)</span>
                </div>
            </div>
            <div style="height:288px">
                <canvas x-ref="salesChart"></canvas>
            </div>
            <template x-if="!dailyData.length && !loadingDaily">
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border-radius:inherit">
                    <div style="text-align:center">
                        <template x-if="dailyError">
                            <p style="font-size:14px;color:#ef4444;margin-bottom:12px" x-text="dailyError"></p>
                        </template>
                        <button @click="loadDailyData()" class="sh-btn sh-btn--primary sh-btn--sm">
                            <span x-text="dailyError ? 'Попробовать снова' : 'Загрузить данные по дням'"></span>
                        </button>
                    </div>
                </div>
            </template>
            <template x-if="loadingDaily">
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.8);border-radius:inherit">
                    <svg class="animate-spin" style="height:32px;width:32px;color:var(--accent)" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </div>
            </template>
        </div>

        <!-- Conversions donut -->
        <div class="sh-card" style="padding:24px">
            <h2 style="font-family:var(--font-display);font-style:italic;font-size:1.25rem;color:var(--text);margin-bottom:24px">Воронка конверсий</h2>
            <div style="height:224px;display:flex;align-items:center;justify-content:center">
                <canvas x-ref="funnelDonut"></canvas>
            </div>
            <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
                    <span style="display:flex;align-items:center;gap:8px">
                        <span style="width:12px;height:12px;border-radius:50%;background:#6366f1"></span>
                        <span style="color:var(--text-secondary)">Просмотры</span>
                    </span>
                    <span style="font-weight:500;color:var(--text)" x-text="kpi.openCardCount.toLocaleString('ru-RU')"></span>
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
                    <span style="display:flex;align-items:center;gap:8px">
                        <span style="width:12px;height:12px;border-radius:50%;background:#3b82f6"></span>
                        <span style="color:var(--text-secondary)">В корзину</span>
                    </span>
                    <span style="font-weight:500;color:var(--text)" x-text="kpi.addToCartCount.toLocaleString('ru-RU')"></span>
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
                    <span style="display:flex;align-items:center;gap:8px">
                        <span style="width:12px;height:12px;border-radius:50%;background:#10b981"></span>
                        <span style="color:var(--text-secondary)">Заказы</span>
                    </span>
                    <span style="font-weight:500;color:var(--text)" x-text="kpi.orders.toLocaleString('ru-RU')"></span>
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
                    <span style="display:flex;align-items:center;gap:8px">
                        <span style="width:12px;height:12px;border-radius:50%;background:#f59e0b"></span>
                        <span style="color:var(--text-secondary)">Выкупы</span>
                    </span>
                    <span style="font-weight:500;color:var(--text)" x-text="kpi.buyouts.toLocaleString('ru-RU')"></span>
                </div>
            </div>
        </div>
    </div>

    {# ── Bottom Row ── #}
    <div style="display:grid;grid-template-columns:1fr;gap:24px" class="lg:grid-cols-2">
        <!-- Top Products -->
        <div class="sh-card" style="padding:24px">
            <div class="sh-section-title" style="margin-bottom:20px">
                <span>Топ товаров по заказам</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px">
                <template x-for="(product, idx) in topProducts" :key="idx">
                    <div>
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                            <div style="display:flex;align-items:center;gap:12px">
                                <span style="width:24px;height:24px;border-radius:6px;background:var(--bg);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center" x-text="idx + 1"></span>
                                <div>
                                    <span style="font-size:14px;font-weight:500;color:var(--text);display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="product.title || product.vendorCode"></span>
                                    <span style="font-size:12px;color:var(--text-muted)" x-text="product.brandName"></span>
                                </div>
                            </div>
                            <div style="text-align:right">
                                <span style="font-size:14px;font-weight:600;color:var(--text);display:block" x-text="formatMoney(product.orderSum)"></span>
                                <span style="font-size:12px;color:var(--text-muted)" x-text="product.orderCount + ' шт.'"></span>
                            </div>
                        </div>
                        <div style="width:100%;background:var(--bg);border-radius:9999px;height:8px">
                            <div style="height:8px;border-radius:9999px;background:var(--accent);transition:width 0.5s"
                                :style="'width:' + (topProducts.length ? (product.orderSum / topProducts[0].orderSum * 100) : 0) + '%'"></div>
                        </div>
                    </div>
                </template>
                <template x-if="!topProducts.length">
                    <p style="font-size:14px;color:var(--text-muted);text-align:center;padding:16px 0">Нет данных за выбранный период</p>
                </template>
            </div>
        </div>

        <!-- Product Analytics Table -->
        <div class="sh-card" style="padding:24px">
            <div class="sh-section-title" style="margin-bottom:20px">
                <span>Детализация по товарам</span>
            </div>
            <div class="sh-table-wrap">
                <table class="sh-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th style="text-align:right">Заказы</th>
                            <th style="text-align:right">Выкупы</th>
                            <th style="text-align:right">Выкуп %</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(item, idx) in productsList" :key="idx">
                            <tr>
                                <td>
                                    <p style="font-weight:500;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="item.title || item.vendorCode"></p>
                                    <p style="font-size:12px;color:var(--text-muted)" x-text="item.brandName + ' | ' + item.vendorCode"></p>
                                </td>
                                <td style="text-align:right">
                                    <span style="font-weight:500;color:var(--text)" x-text="formatMoney(item.ordersSum)"></span>
                                    <p style="font-size:12px;color:var(--text-muted)" x-text="item.ordersCount + ' шт.'"></p>
                                </td>
                                <td style="text-align:right">
                                    <span style="font-weight:500;color:var(--text)" x-text="formatMoney(item.buyoutsSum)"></span>
                                    <p style="font-size:12px;color:var(--text-muted)" x-text="item.buyoutsCount + ' шт.'"></p>
                                </td>
                                <td style="text-align:right">
                                    <span class="sh-badge sh-badge--sm"
                                        :class="item.conversions.buyoutPercent >= 50 ? 'sh-badge--green' : item.conversions.buyoutPercent >= 30 ? 'sh-badge--yellow' : 'sh-badge--red'"
                                        x-text="item.conversions.buyoutPercent.toFixed(0) + '%'"></span>
                                </td>
                            </tr>
                        </template>
                        <template x-if="!productsList.length">
                            <tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted)">Нет данных</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Data age indicator -->
    <template x-if="dataAge">
        <div style="margin-top:24px;text-align:center;font-size:12px;color:var(--text-muted)">
            <span x-text="'Данные обновлены: ' + dataAge"></span>
        </div>
    </template>
    </div>
    </template>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
function analyticsPage() {
    return {
        period: '30d',
        loading: false,
        loadingDaily: false,
        error: null,
        hasData: false,
        dataAge: null,
        periods: [
            { label: '7д', value: '7d' },
            { label: '30д', value: '30d' },
            { label: '90д', value: '90d' },
            { label: 'Год', value: '1y' },
        ],
        kpi: {
            revenue: 0, orders: 0, avgCheck: 0, buyouts: 0, cancels: 0,
            openCardCount: 0, addToCartCount: 0,
            dynamics: { revenue: null, orders: null, buyouts: null },
            conversions: { addToCartPercent: 0, cartToOrderPercent: 0, buyoutPercent: 0 },
        },
        topProducts: [],
        productsList: [],
        dailyData: [],
        salesChart: null,
        funnelChart: null,
        sparkCharts: {},

        formatMoney(val) {
            return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(val || 0);
        },

        init() {
            this.loadData();
        },

        changePeriod(p) {
            if (this.period === p) return;
            this.period = p;
            this.dailyData = [];
            this.loadData();
        },

        async loadData() {
            this.loading = true;
            this.error = null;
            try {
                const resp = await fetch(`/api/analytics/summary?period=${this.period}`);
                const json = await resp.json();
                if (!resp.ok) throw new Error(json.error || 'Ошибка загрузки');
                this.applyData(json.data);
                this.hasData = true;
                // Load products list
                this.loadProducts();
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },

        async refreshData() {
            this.loading = true;
            this.error = null;
            try {
                const resp = await fetch('/api/analytics/refresh', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ period: this.period }),
                });
                const json = await resp.json();
                if (!resp.ok) throw new Error(json.error || 'Ошибка обновления');
                this.applyData(json.data);
                this.hasData = true;
                this.dailyData = [];
                this.loadProducts();
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },

        async loadProducts() {
            try {
                const resp = await fetch(`/api/analytics/products?period=${this.period}&per_page=10`);
                const json = await resp.json();
                if (resp.ok && json.data) {
                    this.productsList = json.data.items || [];
                }
            } catch (e) {
                console.error('Error loading products:', e);
            }
        },

        dailyError: null,

        async loadDailyData() {
            this.loadingDaily = true;
            this.dailyError = null;
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 120000);
                const resp = await fetch(`/api/analytics/daily?period=${this.period}`, { signal: controller.signal });
                clearTimeout(timeout);
                const json = await resp.json();
                if (!resp.ok) {
                    this.dailyError = json.error || 'Ошибка загрузки';
                } else if (json.data && json.data.length) {
                    this.dailyData = json.data;
                    this.$nextTick(() => this.initSalesChart());
                } else {
                    this.dailyError = 'Нет данных за выбранный период';
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    this.dailyError = 'Превышено время ожидания. Попробуйте позже.';
                } else {
                    this.dailyError = 'Ошибка загрузки данных';
                }
                console.error('Error loading daily data:', e);
            } finally {
                this.loadingDaily = false;
            }
        },

        applyData(data) {
            if (!data) return;
            const k = data.kpi || {};
            this.kpi = {
                revenue: k.revenue || 0,
                orders: k.orders || 0,
                avgCheck: k.avgCheck || 0,
                buyouts: k.buyouts || 0,
                cancels: k.cancels || 0,
                openCardCount: k.openCardCount || 0,
                addToCartCount: k.addToCartCount || 0,
                dynamics: data.dynamics || { revenue: null, orders: null, buyouts: null },
                conversions: data.conversions || { addToCartPercent: 0, cartToOrderPercent: 0, buyoutPercent: 0 },
            };
            this.topProducts = data.topProducts || [];
            if (data.dailyData && data.dailyData.length) {
                this.dailyData = data.dailyData;
            }
            if (data.created_at) {
                this.dataAge = new Date(data.created_at).toLocaleString('ru-RU');
            }

            this.$nextTick(() => {
                this.initSparklines();
                this.initFunnelChart();
                if (this.dailyData.length) {
                    this.initSalesChart();
                }
            });
        },

        initSparklines() {
            const sparkOpts = (color, data) => ({
                type: 'line',
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false } },
                    elements: { point: { radius: 0 }, line: { borderWidth: 2, tension: 0.4 } },
                },
                data: {
                    labels: data.map(() => ''),
                    datasets: [{
                        data: data,
                        borderColor: color,
                        backgroundColor: color + '20',
                        fill: true,
                    }]
                }
            });

            // Generate sparkline data from daily data or random placeholder
            const daily = this.dailyData;
            const revData = daily.length ? daily.map(d => d.orderSum) : Array.from({ length: 7 }, () => Math.random() * 40 + 60);
            const ordData = daily.length ? daily.map(d => d.orderCount) : Array.from({ length: 7 }, () => Math.random() * 40 + 60);
            const avgData = daily.length ? daily.map(d => d.orderCount ? d.orderSum / d.orderCount : 0) : Array.from({ length: 7 }, () => Math.random() * 40 + 60);
            const buyData = daily.length ? daily.map(d => d.buyoutCount) : Array.from({ length: 7 }, () => Math.random() * 40 + 60);

            // Destroy existing charts
            Object.values(this.sparkCharts).forEach(c => c && c.destroy());

            if (this.$refs.sparkRevenue) this.sparkCharts.revenue = new Chart(this.$refs.sparkRevenue, sparkOpts('#6366f1', revData));
            if (this.$refs.sparkOrders) this.sparkCharts.orders = new Chart(this.$refs.sparkOrders, sparkOpts('#3b82f6', ordData));
            if (this.$refs.sparkAvgCheck) this.sparkCharts.avgCheck = new Chart(this.$refs.sparkAvgCheck, sparkOpts('#10b981', avgData));
            if (this.$refs.sparkBuyouts) this.sparkCharts.buyouts = new Chart(this.$refs.sparkBuyouts, sparkOpts('#f59e0b', buyData));
        },

        initSalesChart() {
            if (!this.dailyData.length || !this.$refs.salesChart) return;
            if (this.salesChart) this.salesChart.destroy();

            const labels = this.dailyData.map(d => {
                const dt = new Date(d.date);
                return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            });

            this.salesChart = new Chart(this.$refs.salesChart, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Заказы (руб)',
                            data: this.dailyData.map(d => d.orderSum),
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99,102,241,0.08)',
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: '#6366f1', pointRadius: 3, pointHoverRadius: 6,
                        },
                        {
                            label: 'Заказы (шт)',
                            data: this.dailyData.map(d => d.orderCount),
                            borderColor: '#34d399',
                            backgroundColor: 'rgba(52,211,153,0.08)',
                            fill: true, tension: 0.4, borderWidth: 2,
                            pointBackgroundColor: '#34d399', pointRadius: 3, pointHoverRadius: 6,
                            yAxisID: 'y1',
                        },
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e1b4b', titleColor: '#e0e7ff', bodyColor: '#c7d2fe', cornerRadius: 12, padding: 12 } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#9ca3af' } },
                        y: { grid: { color: '#f3f4f6' }, ticks: { color: '#9ca3af', callback: v => (v/1000) + 'k' } },
                        y1: { position: 'right', grid: { display: false }, ticks: { color: '#9ca3af' } },
                    }
                }
            });
        },

        initFunnelChart() {
            if (!this.$refs.funnelDonut) return;
            if (this.funnelChart) this.funnelChart.destroy();

            this.funnelChart = new Chart(this.$refs.funnelDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Просмотры', 'Корзина', 'Заказы', 'Выкупы'],
                    datasets: [{
                        data: [
                            this.kpi.openCardCount,
                            this.kpi.addToCartCount,
                            this.kpi.orders,
                            this.kpi.buyouts,
                        ],
                        backgroundColor: ['#6366f1', '#3b82f6', '#10b981', '#f59e0b'],
                        borderWidth: 0,
                        hoverOffset: 8,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: '#1e1b4b', cornerRadius: 12, padding: 12 },
                    }
                }
            });
        },
    };
}
</script>
{% endblock %}
