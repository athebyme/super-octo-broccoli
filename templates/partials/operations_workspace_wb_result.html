<div class="operations-wb-result{% if operations_wb_result_context|default('') == 'dark-hero' %} operations-wb-result--dark-hero{% endif %}" data-execution-status="{{ wb_history_presentation.status }}">
    <span class="operations-wb-outcome is-{{ wb_history_presentation.tone }}">{{ wb_history_presentation.label }}</span>
    <p>{{ wb_history_presentation.message }}</p>
    {% if wb_history_presentation.reverted %}<p class="operations-wb-reverted">Для этой операции зарегистрирован откат.</p>{% endif %}
</div>
