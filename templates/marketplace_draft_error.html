{% extends "base.html" %}

{% block title %}Ошибка черновика — Seller Hub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-10">
    <div class="sh-card p-6">
        <h1 class="text-xl font-semibold" style="color:var(--text)">Не удалось обработать черновик</h1>
        <p class="mt-3 text-sm" style="color:var(--text-secondary)">{{ error }}</p>
        <a class="sh-btn sh-btn--secondary mt-5" href="{{ url_for('marketplace_drafts.index') }}">К черновикам</a>
    </div>
</div>
{% endblock %}
