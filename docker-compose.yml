services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SELLER_PORT=${SELLER_PORT:-5001}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - seller-platform

  seller-platform:
    build: .
    container_name: seller-platform
    environment:
      - APP_MODULE=seller_platform:app
      - PORT=${SELLER_PORT:-5001}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env file}
      # ЖЁСТКО ПРОПИСЫВАЕМ DATABASE_URL - НЕ полагаемся на .env
      - DATABASE_URL=sqlite:////app/data/seller_platform.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Manual Ozon account/catalog/card upload is production-default.
      - MARKETPLACE_OZON_ENABLED=${MARKETPLACE_OZON_ENABLED:-1}
      - MARKETPLACE_OZON_PUBLICATION_ENABLED=${MARKETPLACE_OZON_PUBLICATION_ENABLED:-1}
      - MARKETPLACE_OZON_AUTO_PUBLISH_ENABLED=${MARKETPLACE_OZON_AUTO_PUBLISH_ENABLED:-0}
      - MARKETPLACE_OZON_COMMERCIAL_WRITES_ENABLED=${MARKETPLACE_OZON_COMMERCIAL_WRITES_ENABLED:-0}
      - OZON_RATE_LIMIT_DIR=${OZON_RATE_LIMIT_DIR:-/app/data/ozon_api_limits}
      - MARKETPLACE_WB_PROJECTION_ENABLED=${MARKETPLACE_WB_PROJECTION_ENABLED:-1}
      - MARKETPLACE_WB_DUAL_READ_ENABLED=${MARKETPLACE_WB_DUAL_READ_ENABLED:-1}
      - MARKETPLACE_WB_COMMON_READ_ENABLED=${MARKETPLACE_WB_COMMON_READ_ENABLED:-0}
      # Credentials для первого администратора (создается автоматически при первом запуске)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env file}
      # SSL/HTTPS (оставьте пустыми для авто-генерации self-signed)
      - SSL_CERT_PATH=${SSL_CERT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
      - SSL_COMMON_NAME=${SSL_COMMON_NAME:-seller-platform}
      - SSL_SAN_IPS=${SSL_SAN_IPS:-}
      # HTTP→HTTPS редирект отключён — Caddy делает это сам
      - DISABLE_HTTP_REDIRECT=1
      # Публичный URL для раздачи фото (WB скачивает по этим URL)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Seller UI photo cache misses never fetch upstream in a web request.
      - PHOTO_CACHE_DIR=${PHOTO_CACHE_DIR:-/app/data/photo_cache}
      - PHOTO_DOWNLOAD_WORKERS=${PHOTO_DOWNLOAD_WORKERS:-2}
      - PHOTO_DOWNLOAD_QUEUE_SIZE=${PHOTO_DOWNLOAD_QUEUE_SIZE:-256}
      - PHOTO_DOWNLOAD_TOTAL_SECONDS=${PHOTO_DOWNLOAD_TOTAL_SECONDS:-12}
      - PHOTO_PUBLIC_FETCH_CONCURRENCY=${PHOTO_PUBLIC_FETCH_CONCURRENCY:-2}
      - PHOTO_CACHE_MAX_BYTES=${PHOTO_CACHE_MAX_BYTES:-16106127360}
      - PHOTO_CACHE_PRUNE_TO_BYTES=${PHOTO_CACHE_PRUNE_TO_BYTES:-12884901888}
      - PHOTO_CACHE_MIN_FREE_BYTES=${PHOTO_CACHE_MIN_FREE_BYTES:-5368709120}
      - PHOTO_CACHE_MAINTENANCE_INTERVAL_SECONDS=${PHOTO_CACHE_MAINTENANCE_INTERVAL_SECONDS:-1800}
      # Immutable JPEG assets used by asynchronous Ozon product imports.
      - MARKETPLACE_IMAGE_ASSET_DIR=${MARKETPLACE_IMAGE_ASSET_DIR:-/app/data/marketplace_image_assets}
      - OZON_MEDIA_ASSET_URLS_PER_ATTEMPT=${OZON_MEDIA_ASSET_URLS_PER_ATTEMPT:-3}
      - OZON_MEDIA_ASSET_ATTEMPT_SECONDS=${OZON_MEDIA_ASSET_ATTEMPT_SECONDS:-40}
      # Прокси для AI и image generation (OpenRouter, OpenAI, Claude, Gemini)
      # Формат: socks5://172.17.0.1:10808  (xray SOCKS5 на хосте)
      - AI_PROXY=${AI_PROXY:-}
      - IMAGE_GEN_PROXY=${IMAGE_GEN_PROXY:-}
      # Фотостудия: ключи остаются только на backend
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_IMAGE_MODEL=${OPENROUTER_IMAGE_MODEL:-google/gemini-3.1-flash-lite-image}
      - OPENROUTER_IMAGE_RESOLUTION=${OPENROUTER_IMAGE_RESOLUTION:-1K}
      - GEN_API_KEY=${GEN_API_KEY:-}
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY:-}
      - GPU_IMAGE_SERVER_URL=${GPU_IMAGE_SERVER_URL:-}
      - GPU_IMAGE_SERVER_TOKEN=${GPU_IMAGE_SERVER_TOKEN:-}
      - GPU_IMAGE_ALLOW_HTTP=${GPU_IMAGE_ALLOW_HTTP:-0}
      - GPU_IMAGE_STEPS=${GPU_IMAGE_STEPS:-4}
      - GPU_IMAGE_TRUE_CFG=${GPU_IMAGE_TRUE_CFG:-1.0}
      - GPU_IMAGE_RUB_PER_GENERATION=${GPU_IMAGE_RUB_PER_GENERATION:-1.0}
      - IMAGE_LAB_MAX_ACTIVE_JOBS=${IMAGE_LAB_MAX_ACTIVE_JOBS:-3}
      - IMAGE_LAB_DAILY_JOB_LIMIT=${IMAGE_LAB_DAILY_JOB_LIMIT:-50}
      - IMAGE_LAB_DAILY_BUDGET_RUB=${IMAGE_LAB_DAILY_BUDGET_RUB:-500}
      - IMAGE_LAB_PROVIDER_TIMEOUT=${IMAGE_LAB_PROVIDER_TIMEOUT:-180}
      - IMAGE_LAB_DATA_DIR=/app/data/image_lab
      - IMAGE_LAB_INLINE_WORKER=${IMAGE_LAB_INLINE_WORKER:-1}
      - MEDIA_PUBLICATION_DATA_DIR=${MEDIA_PUBLICATION_DATA_DIR:-/app/data/image_lab/media_publications}
      - MEDIA_PUBLICATION_INLINE_WORKER=${MEDIA_PUBLICATION_INLINE_WORKER:-1}
      - INFOGRAPHIC_REMBG_MODEL=${INFOGRAPHIC_REMBG_MODEL:-u2net}
      - SUPPLIER_ENRICHMENT_LLM_CONCURRENCY=${SUPPLIER_ENRICHMENT_LLM_CONCURRENCY:-1}
      # Restart-safe WB supplier enrichment dispatch + live reconciliation.
      - WB_ENRICHMENT_ITEMS_PER_TICK=${WB_ENRICHMENT_ITEMS_PER_TICK:-3}
      - WB_ENRICHMENT_TICK_SECONDS=${WB_ENRICHMENT_TICK_SECONDS:-45}
      - WB_ENRICHMENT_LEASE_SECONDS=${WB_ENRICHMENT_LEASE_SECONDS:-600}
      - WB_ENRICHMENT_RECONCILE_ITEMS_PER_TICK=${WB_ENRICHMENT_RECONCILE_ITEMS_PER_TICK:-10}
      - WB_ENRICHMENT_RECONCILE_MAX_ATTEMPTS=${WB_ENRICHMENT_RECONCILE_MAX_ATTEMPTS:-6}
      - WB_ENRICHMENT_RECONCILE_INITIAL_SECONDS=${WB_ENRICHMENT_RECONCILE_INITIAL_SECONDS:-90}
      # Общий WB→товар поставщика matcher: bounded singleton job + shared cache.
      - COMPETITOR_MATCH_ITEMS_PER_TICK=${COMPETITOR_MATCH_ITEMS_PER_TICK:-3}
      - COMPETITOR_MATCH_TICK_SECONDS=${COMPETITOR_MATCH_TICK_SECONDS:-45}
      - COMPETITOR_MATCH_LLM_MAX_PER_JOB=${COMPETITOR_MATCH_LLM_MAX_PER_JOB:-300}
      - COMPETITOR_MATCH_RECHECK_DAYS=${COMPETITOR_MATCH_RECHECK_DAYS:-30}
      - COMPETITOR_MATCH_INDEX_TTL_SECONDS=${COMPETITOR_MATCH_INDEX_TTL_SECONDS:-600}
      - COMPETITOR_MATCH_MAX_PHOTOS_PER_SIDE=${COMPETITOR_MATCH_MAX_PHOTOS_PER_SIDE:-3}
      - COMPETITOR_MATCH_IMAGE_MAX_BYTES=${COMPETITOR_MATCH_IMAGE_MAX_BYTES:-8388608}
    # Порты НЕ пробрасываем наружу — доступ только через Caddy
    expose:
      - "${SELLER_PORT:-5001}"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - seller_platform_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  image-lab-worker:
    build: .
    container_name: image-lab-worker
    entrypoint: ["/usr/bin/gosu", "app", "python", "scripts/run_image_lab_worker.py"]
    environment:
      - SKIP_SCHEDULER=1
      - DATABASE_URL=sqlite:////app/data/seller_platform.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env file}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_IMAGE_MODEL=${OPENROUTER_IMAGE_MODEL:-google/gemini-3.1-flash-lite-image}
      - OPENROUTER_IMAGE_RESOLUTION=${OPENROUTER_IMAGE_RESOLUTION:-1K}
      - AI_PROXY=${AI_PROXY:-}
      - IMAGE_GEN_PROXY=${IMAGE_GEN_PROXY:-}
      - GEN_API_KEY=${GEN_API_KEY:-}
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY:-}
      - GPU_IMAGE_SERVER_URL=${GPU_IMAGE_SERVER_URL:-}
      - GPU_IMAGE_SERVER_TOKEN=${GPU_IMAGE_SERVER_TOKEN:-}
      - GPU_IMAGE_ALLOW_HTTP=${GPU_IMAGE_ALLOW_HTTP:-0}
      - GPU_IMAGE_STEPS=${GPU_IMAGE_STEPS:-4}
      - GPU_IMAGE_TRUE_CFG=${GPU_IMAGE_TRUE_CFG:-1.0}
      - GPU_IMAGE_RUB_PER_GENERATION=${GPU_IMAGE_RUB_PER_GENERATION:-1.0}
      - IMAGE_LAB_PROVIDER_TIMEOUT=${IMAGE_LAB_PROVIDER_TIMEOUT:-180}
      - IMAGE_LAB_DATA_DIR=/app/data/image_lab
      - IMAGE_LAB_INLINE_WORKER=0
      - MEDIA_PUBLICATION_DATA_DIR=${MEDIA_PUBLICATION_DATA_DIR:-/app/data/image_lab/media_publications}
      - MEDIA_PUBLICATION_INLINE_WORKER=0
      - INFOGRAPHIC_REMBG_MODEL=${INFOGRAPHIC_REMBG_MODEL:-u2net}
    volumes:
      - seller_platform_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seller-platform:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - image-lab

  # ══════════════════════════════════════════════════════════
  # Сервисные агенты
  # Раскомментируйте нужных агентов и заполните AGENT_ID / AGENT_API_KEY
  # (получаете при активации агента в UI: /agents → Активировать)
