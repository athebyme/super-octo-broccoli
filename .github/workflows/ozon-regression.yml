name: Ozon regression
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ozon-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Contract and Chromium integration checks
        run: bash scripts/check_ozon_release.sh "$RUNNER_TEMP/ozon-check-report"
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ozon-regression
          path: ${{ runner.temp }}/ozon-check-report
          if-no-files-found: warn
          retention-days: 7
